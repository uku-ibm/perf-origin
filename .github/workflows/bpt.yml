name: bpt
on:
  workflow_dispatch:
env: 
  TENANT_USERNAME: ${{secrets.TENANT_USERNAME}}
  TENANT_PASSWORD: ${{secrets.TENANT_PASSWORD}}
  AUTH_CODE: ${{secrets.AUTH_CODE}}
jobs:
  setup:
    name: Checkout and fetch the baseline
    runs-on: vadorigin1

    steps:
    - name: Remove the existing files
      env:
        RUNNER_CONTEXT: ${{ toJson(runner) }}
      run: |
         echo "Running on $RUNNER_CONTEXT"
         rm -rf *
    - uses: actions/checkout@v4
      with:
        path: main
    - name: Pull the docker image and push it to the cloud.
      run: |
         cp -r main/* .
         echo "pull the docker image and push it to the cloud."
         CURRENT_DIRECTORY=$PWD
         echo "CURRENT_DIRECTORY=$PWD"
         sh edge_docker_image.sh pull_edge_runtime_image $CURRENT_DIRECTORY

    - uses: actions/upload-artifact@v3
      with:
        name: edge-docker-image
        path: .

  edge-runtime-setup:
    name: Setup edge runtime
    needs: setup
    runs-on: CA3S-AWS-2

    steps:
    - name: Download the edge server and start the edge server
      env: 
        RUNNER_CONTEXT: ${{ toJson(runner) }} 
      run: |
         echo "Downloading the edge server."
         rm -rf *
    - uses: actions/download-artifact@v3
      with:
        name: edge-docker-image
        path: .
    - name: load the docker image
      run: |
         cp -r main/* .
         echo "Load the docker image."
         CURRENT_DIRECTORY=$PWD
         echo "CURRENT_DIRECTORY=$PWD"
         sh edge_docker_image.sh load_edge_runtime_image $CURRENT_DIRECTORY