name: main

on:
  workflow_dispatch:

jobs:
  job1:
    name: Job 1
    runs-on: CA3S-AWS

    steps:
    - uses: actions/checkout@v3
    - name: Run a one-line script
      run: |
        sh test.sh
    - uses: actions/upload-artifact@v3
      with:
          name: jmeter-results-CSV
          path: TEMP_DIRECTORY/**/*.csv
  job2:
    name: Job 2
    needs: job1
    runs-on: vadorigin1

    steps:
    - uses: actions/checkout@v3
      with:
          token: ${{ secrets.TOKEN }}
          repository: C2E/PerfUtil
          ref: master
    - name: Dependant is Running
      run: |
        java -cp bpt_utils.jar perf.bpt.metadata.TestMaster RUN_ID > temp.txt
        mkdir TEMP_DIRECTORY
    - uses: actions/download-artifact@v2
      with:
        name: jmeter-results-CSV
    - name: Copy file
      run: |
        echo Copy File!
        cat temp.txt
        run_id=$(cat temp.txt)
        echo run id: $run_id
        cp *.csv TEMP_DIRECTORY/
        sh store_results.sh